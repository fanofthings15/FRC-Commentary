name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows exe (embeds the built UI bundle)
        run: bun run build:exe

      - name: Version the exe (matches the README / auto-updater naming)
        run: mv app.exe "app-${GITHUB_REF_NAME#v}.exe"

      - name: Create GitHub release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: app-*.exe
          generate_release_notes: true
